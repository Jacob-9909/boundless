<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Boundless 로고: 조각보 ㅂ</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Asta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Asta Sans", "Apple SD Gothic Neo", sans-serif; color: #1A1D24; background: #fff; padding: 48px 56px 64px; width: 1440px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  h2 { font-size: 19px; font-weight: 800; margin-top: 40px; }
  p { color: #4A505C; margin-top: 6px; font-size: 15px; line-height: 1.6; max-width: 72ch; }
  .row { display: flex; gap: 18px; margin-top: 16px; align-items: stretch; flex-wrap: wrap; }
  .tile { border-radius: 16px; display: grid; place-items: center; width: 250px; height: 250px; }
  .word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .lockup { display: inline-flex; align-items: center; gap: 9px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #4A505C; }
  .bar { border-radius: 14px; padding: 16px 20px; width: 210px; }
</style>
</head>
<body>
<h1>조각보 ㅂ</h1>

<h2>1. 기본형</h2>
<p>네 조각, 네 노선 색. 크기가 다른 조각이 엇갈려 이어진 조각보 방식이고, 솔기는 획을 가로지르기만 해서 ㅂ 윤곽은 그대로 남습니다. 솔기는 투명한 틈이라 어떤 배경에도 올라갑니다.</p>
<div class="row" id="base"></div>

<h2>2. 내 조각</h2>
<p>오른쪽 위 작은 조각은 가장 최근에 덧댄 조각, 곧 새로 온 이웃입니다. 로그인하면 이 조각이 내 나라 테마 색으로 바뀝니다. 같은 천에 내 조각이 하나 꿰매져 있는 셈이에요.</p>
<div class="row" id="mine"></div>

<h2>3. 크기와 자리</h2>
<div class="row" id="sizes"></div>

<script>
const L = { sky: "#00A5DE", orange: "#EF7C1C", purple: "#996CAC", green: "#00A84D" };
let uid = 0;

/* ㅂ in a 48 box, every stroke 8 thick so the corner mitres run at 45°: columns x8-16 and x32-40,
   middle bar y17-25, bottom bar y32-40, open top. */
const SHAPE = "M8 8H16V17H32V8H40V40H8ZM16 25V32H32V25Z";
// Patches cover the whole box; the shape clips them. Seams only cross strokes.
const PATCHES = [
  ["0,0 27,0 27,30 0,30", "sky"],
  ["27,0 48,0 48,14 27,14", "mine"],
  ["27,14 48,14 48,48 24,48 24,30 27,30", "purple"],
  ["0,30 24,30 24,48 0,48", "green"],
];
// Every seam crosses one stroke and ends in the open space, so the letter's outline never breaks.
const SEAMS = [[31, 14, 41, 14], [27, 16, 27, 26], [7, 30, 17, 30], [24, 31, 24, 41]];

function mark({ mine = L.orange, gap = 1.7, stitch = false, stitchColor = "#fff" } = {}) {
  const id = "m" + uid++;
  const fills = { ...L, mine };
  const seams = SEAMS.map(([a, b, c, d]) => `M${a} ${b}L${c} ${d}`).join("");
  let marks = "";
  if (stitch) {
    // 감침질: short slanted stitches over each seam, every 2.6 units
    for (const [x1, y1, x2, y2] of SEAMS) {
      const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      for (let t = 1.6; t < len - 0.8; t += 2.6) {
        const cx = x1 + ux * t, cy = y1 + uy * t;
        // stitch: perpendicular, tilted along the seam
        const px = -uy, py = ux, h = 1.9;
        marks += `M${(cx - px * h - ux * .6).toFixed(2)} ${(cy - py * h - uy * .6).toFixed(2)}L${(cx + px * h + ux * .6).toFixed(2)} ${(cy + py * h + uy * .6).toFixed(2)}`;
      }
    }
  }
  return `<svg viewBox="4 4 40 40" width="100%" height="100%">
    <defs>
      <clipPath id="c${id}"><path d="${SHAPE}" fill-rule="evenodd"/></clipPath>
      <mask id="k${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
        <rect width="48" height="48" fill="#fff"/><path d="${seams}" stroke="#000" stroke-width="${gap}"/>
      </mask>
    </defs>
    <g clip-path="url(#c${id})"><g mask="url(#k${id})">
      ${PATCHES.map(([p, c]) => `<polygon points="${p}" fill="${fills[c]}"/>`).join("")}
    </g>
    ${stitch ? `<path d="${marks}" stroke="${stitchColor}" stroke-width=".55" stroke-linecap="round" opacity=".9"/>` : ""}
    </g></svg>`;
}

const box = (html, px) => `<span style="display:block;width:${px}px;height:${px}px">${html}</span>`;
const tile = (bg, html, extra = "") => `<div class="tile" style="background:${bg};${extra}">${html}</div>`;

document.getElementById("base").innerHTML =
  tile("#0E1730", box(mark(), 160)) +
  tile("#F2F4F8", box(mark(), 160)) +
  tile("linear-gradient(160deg,#A8242B,#E07A3A)", box(mark(), 160)) +
  tile("#fff", box(mark(), 160), "box-shadow:0 0 0 1px #E3E6EC inset");

const cultures = [
  ["기본", null, null], ["Việt Nam", "#A8242B", "#F2A7B5"], ["日本", "#1F3A5F", "#9DB4CF"], ["中国", "#B3122B", "#E8B33A"],
  ["Pilipinas", "#0038A8", "#FCD116"], ["Oʻzbekiston", "#0B6E73", "#7FD3CF"], ["ประเทศไทย", "#4B2A82", "#D9A520"], ["Монгол", "#0B5CAD", "#F2B705"],
];
document.getElementById("mine").innerHTML = cultures.map(([name, primary, accent]) => `
  <div class="chip">
    <div class="bar" style="background:${primary || "#0E1730"}"><span class="lockup" style="color:#fff">${box(mark({ mine: accent || L.orange }), 30)}<span class="word" style="font-size:22px">boundless</span></span></div>
    <div class="bar" style="background:#FAFAF7;box-shadow:0 0 0 1px #E3E6EC inset"><span class="lockup" style="color:#14234A">${box(mark({ mine: primary || L.orange }), 30)}<span class="word" style="font-size:22px">boundless</span></span></div>
    ${name}
  </div>`).join("");

const icon = (px, bg = "#fff", gap) => `<span style="display:inline-grid;place-items:center;width:${px}px;height:${px}px;border-radius:${px * .23}px;background:${bg};box-shadow:0 0 0 1px #E3E6EC inset">${box(mark({ gap }), px * .74)}</span>`;
document.getElementById("sizes").innerHTML =
  `<div class="chip">${icon(120)}앱 아이콘</div>` +
  `<div class="chip">${icon(120, "#14234A")}앱 아이콘 (어두운 판)</div>` +
  `<div class="chip" style="justify-content:flex-end">${icon(48)}48</div>` +
  `<div class="chip" style="justify-content:flex-end">${icon(32, "#fff", 2.6)}32</div>` +
  `<div class="chip" style="justify-content:flex-end">${box(mark({ gap: 3 }), 20)}20 (탭)</div>` +
  `<div class="chip" style="justify-content:flex-end">${box(mark({ gap: 3 }), 16)}16 (탭)</div>`;
</script>
</body>
</html>
