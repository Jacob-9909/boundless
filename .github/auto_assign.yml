# Probot Auto Assign (https://github.com/apps/auto-assign): runs once the app is installed on this repository.
# The app leaves the PR's author out of both lists, so with a team of one it picked nobody (PR #7).
# "author" assigns whoever opened the PR; reviewers start working once a teammate is on the list.
addReviewers: true
addAssignees: author
reviewers:
  - Jacob-9909
# 0 = everyone on the list. After adding teammates, set numberOfReviewers to 1 so each PR gets one of them.
numberOfReviewers: 0
skipKeywords:
  - wip
