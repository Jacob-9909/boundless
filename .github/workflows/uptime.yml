name: Uptime

# Hourly look at production. A failed run makes GitHub email the repo admins; with the ALERT_WEBHOOK_URL
# secret (Slack or Discord incoming webhook) it also posts there. Hourly keeps it inside the free Actions
# minutes; for checks every minute use an external monitor on the same URL (docs/DEPLOY.md "모니터링").

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://boundless-virid.vercel.app/api/health
      - name: Alert
        if: failure()
        env:
          HOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          test -n "$HOOK" || exit 0
          msg="[Boundless] health check failed: https://boundless-virid.vercel.app/api/health ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          curl -fsS -H 'content-type: application/json' -d "{\"text\":\"$msg\",\"content\":\"$msg\"}" "$HOOK"
