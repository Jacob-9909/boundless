name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-only-not-a-secret
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/i18n-check.mjs
      - run: node --no-warnings scripts/moderation-check.mjs
      - run: npm run build
      - run: node scripts/db.mjs db/schema.sql db/seed.sql
      # e2e runs against the dev server: without SMTP it shows the sign-in code on screen.
      - name: e2e
        run: |
          npx next dev -p 3000 > dev.log 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:3000/api/health && break; sleep 2; done
          BASE_URL=http://localhost:3000 CHROME_PATH=$(which google-chrome) node e2e/flow.mjs || (tail -50 dev.log; exit 1)

  # Lint findings as inline review comments on the lines a PR changed (the check job above still gates the merge).
  # Skipped on Dependabot PRs: their token cannot write reviews.
  reviewdog:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: reviewdog/action-eslint@v1
        with:
          reporter: github-pr-review
          filter_mode: added
          eslint_flags: "."

  # CD: only after the checks pass on main. Builds here, uploads the prebuilt output to Vercel.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: production
      url: https://boundless-virid.vercel.app
    env:
      # Project identifiers, not secrets (also in .vercel/project.json after `vercel link`).
      VERCEL_ORG_ID: team_n6RysxNek0puntAZW4aJmVcZ
      VERCEL_PROJECT_ID: prj_Jo82mFSFN1XNeHCJ59CoKWiHqggd
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check token
        run: test -n "$VERCEL_TOKEN" || (echo "::error::Add the VERCEL_TOKEN repository secret (see docs/DEPLOY.md)"; exit 1)
      - run: npm ci
      - run: npx vercel@65.12.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Schema is idempotent; apply it before the new code goes live.
      - name: Migrate
        run: |
          set -a; . .vercel/.env.production.local; set +a
          DATABASE_URL="$DATABASE_URL_UNPOOLED" node scripts/db.mjs db/schema.sql
      - run: npx vercel@65.12.1 build --prod --token="$VERCEL_TOKEN"
      - run: npx vercel@65.12.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 3 https://boundless-virid.vercel.app/api/health
