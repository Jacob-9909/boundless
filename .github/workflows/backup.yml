name: Backup

# Daily logical backup of the production database, kept apart from Neon's own point-in-time restore.
# Each run also restores the dump into a throwaway Postgres and counts rows, so a backup that cannot be
# restored fails here instead of on the day it is needed. A failed scheduled run is emailed only to the person who
# last changed the cron line (if their Actions notifications are on), so someone should watch the Actions tab.
# Secrets: VERCEL_TOKEN (already used by CI/CD) and BACKUP_PASSPHRASE (long random string; without it the
# files cannot be read, so keep a copy outside GitHub). Restore steps: docs/DEPLOY.md "백업과 복구".

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash -eo pipefail: a failed pg_dump fails the step instead of leaving an empty encrypted file.
        shell: bash
    env:
      VERCEL_ORG_ID: team_n6RysxNek0puntAZW4aJmVcZ
      VERCEL_PROJECT_ID: prj_Jo82mFSFN1XNeHCJ59CoKWiHqggd
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Add the VERCEL_TOKEN repository secret"; exit 1)
          test -n "$BACKUP_PASSPHRASE" || (echo "::error::Add the BACKUP_PASSPHRASE repository secret (docs/DEPLOY.md)"; exit 1)
      - run: npx --yes vercel@65.12.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      # pg_dump refuses a server newer than itself, so dump and restore with the server's own major version.
      - name: Dump and encrypt
        run: |
          set -a; . .vercel/.env.production.local; set +a
          rm -f .vercel/.env.production.local
          major=$(docker run --rm postgres:17 psql "$DATABASE_URL_UNPOOLED" -Atc "SHOW server_version_num" | cut -c1-2)
          echo "server major version $major"
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"
          name="boundless-$(date -u +%Y%m%d-%H%M).dump"
          docker run --rm "postgres:$major" pg_dump --format=custom --no-owner --no-privileges --schema=boundless "$DATABASE_URL_UNPOOLED" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$name.enc"
          echo "BACKUP=$name.enc" >> "$GITHUB_ENV"
          ls -l "$name.enc"
      - name: Restore test
        run: |
          docker run -d --name restore -e POSTGRES_PASSWORD=postgres "postgres:$PG_MAJOR" > /dev/null
          # The image starts a temporary server for initdb first; the second "ready" line is the real one.
          for _ in $(seq 60); do [ "$(docker logs restore 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "$BACKUP" -out restore.dump
          # Trigram indexes need the extension before their tables come back (db/migrations/0004).
          docker exec restore psql -U postgres -qc "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          docker exec -i restore pg_restore -U postgres -d postgres --no-owner --exit-on-error < restore.dump
          docker exec restore psql -U postgres -c "SELECT (SELECT count(*) FROM boundless.users) AS users, (SELECT count(*) FROM boundless.posts) AS posts, (SELECT count(*) FROM boundless.comments) AS comments, (SELECT max(version) FROM boundless.schema_migrations) AS schema"
          rm -f restore.dump
          docker rm -f restore > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP }}
          path: ${{ env.BACKUP }}
          retention-days: 7
          if-no-files-found: error
