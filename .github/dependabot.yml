# Dependabot: weekly version updates. Security updates also need "Dependabot alerts" and
# "Dependabot security updates" switched on under Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # next and its ESLint config must move together.
      next:
        patterns: ["next", "eslint-config-next"]
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions of the toolchain wait for a deliberate upgrade: TypeScript 7 broke lint
    # (typescript-eslint did not support it yet, #5). Security updates still come through.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
